# Render blueprint — deploys the SDET Interview Gym backend.
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repository.
# During the blueprint prompt, set CORS_ORIGINS to your GitHub Pages origin
# (e.g. https://dayacode12.github.io) plus http://localhost:3000 for local dev.
#
# Database: this app expects a managed PostgreSQL via DATABASE_URL. Create one
# (Aiven / Neon / Supabase) and paste its service URI into the Render dashboard
# env var when prompted. The value is a secret — never commit it. Without it,
# the backend falls back to a SQLite file inside the container, which is wiped
# on every deploy/restart (drafts then only persist on each device).
services:
  - type: web
    name: sdet-interview-gym-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true # redeploy on every push to main
    envVars:
      # Managed Postgres connection string (Aiven/Neon/Supabase).
      # sync: false => Render prompts for it; it is never stored in this repo.
      - key: DATABASE_URL
        sync: false
      # JDK 21 is baked into the image, so candidate Java code really compiles
      # and runs ("local" subprocess mode). Never faked.
      - key: JAVA_EXECUTION_MODE
        value: local
      # Set during blueprint deploy: your GitHub Pages origin + localhost.
      - key: CORS_ORIGINS
        sync: false
      # Optional LLM scoring; leave empty for the rule-based rubric.
      - key: LLM_API_KEY
        sync: false
      # In-app interview assistant (Groq). sync: false => Render prompts for it
      # and stores it encrypted; it is never committed to the repo.
      - key: GROQ_API_KEY
        sync: false
